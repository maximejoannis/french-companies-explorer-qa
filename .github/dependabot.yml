version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      # Mises à jour mineures et correctives regroupées ; chaque version majeure arrive dans sa propre PR
      # (plus facile d'isoler la cause d'un échec).
      dev-tooling:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
